site_name: Estudo de Formulários — X-Forms
site_description: Estudo da SETDIG sobre diagramação, boas práticas e nomenclatura de campos em formulários de serviços digitais do Estado de MS.
site_author: SETDIG — Secretaria-Executiva de Transformação Digital
site_url: https://fabioramos-02.github.io/estudo-formularios/

docs_dir: docs

theme:
  name: material
  language: pt-BR

  logo: assets/img/segov-logo.svg
  favicon: assets/img/brasao-ms.svg
  font: false

  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo escuro

    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo claro

  features:
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - assets/css/segov.css

extra:
  generator: false

  social:
    - icon: material/web
      link: https://www.setdig.ms.gov.br/
      name: SETDIG

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables

  - toc:
      permalink: true

  - pymdownx.details

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji

nav:
  - Início: index.md
  - Guia do Antonio: guia-do-antonio.md
  - 1. Diagramação: 01-diagramacao.md
  - 2. Aprendizados: 02-aprendizados.md
  - 3. Nomenclatura: 03-nomenclatura.md
  - 4. Checklist: 04-checklist.md
  - 5. Auditoria dos 14: 05-auditoria.md
  - Andamento:
      - Visão geral: andamento/index.md
      - Mapeamento dos 14:
          - Visão estratégica: andamento/mapeamento/index.md
          - 01. WordPress: andamento/mapeamento/01-wordpress.md
          - 02. RT agrícola: andamento/mapeamento/02-rt-agricola.md
          - 03. Diárias Fundect: andamento/mapeamento/03-diarias-fundect.md
          - 04. Indústria agrotóxicos: andamento/mapeamento/04-industria-agrotoxicos.md
          - 05. Cancelar agrotóxicos: andamento/mapeamento/05-cancelar-agrotoxicos.md
          - 06. Selo Arte: andamento/mapeamento/06-selo-arte.md
          - 07. Negativa de tombamento: andamento/mapeamento/07-negativa-tombamento.md
          - 08. Veterinário avi/suíno: andamento/mapeamento/08-veterinario-avi-suino.md
          - 09. Bibliotecas públicas: andamento/mapeamento/09-bibliotecas-publicas.md
          - 10. Empresa integradora: andamento/mapeamento/10-empresa-integradora.md
          - 11. Soqueira de algodão: andamento/mapeamento/11-soqueira-algodao.md
          - 12. Laudos periciais: andamento/mapeamento/12-laudos-periciais.md
          - 13. Laboratório avícola: andamento/mapeamento/13-laboratorio-avicola.md
          - 14. Certidão 190/193: andamento/mapeamento/14-certidao-190-193.md
      - Recomendações comuns: andamento/recomendacoes.md
      - Recomendações GOV.UK: andamento/recomendacoesGOVUK.md
      - 1. WordPress — Notas: andamento/wordpress.md
      - 1. WordPress — Refatoração: andamento/01-wordpress/notas.md
  - Fichas:
      - Como preencher: fichas/_template.md
  - Fontes: fontes.md
